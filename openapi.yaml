openapi: 3.0.0
info:
  title: Main API
  version: "1.0"
  description: API информационной системы сети ресторанов «Ромашка»

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/get_default_report:
    get:
      summary: Получить отчет по сущности
      description: Генерирует отчет для конкретного объекта по его уникальному коду в формате по умолчанию.
      operationId: main.get_default_report
      parameters:
        - name: entity
          in: query
          required: true
          schema:
            type: string
          description: Ключ сущности (например, nomenclature_model, group_model).
        - name: unique_code
          in: query
          required: true
          schema:
            type: string
          description: Уникальный код конкретного объекта.
      responses:
        '200':
          description: Успешно сгенерированный отчет.
          content:
            text/plain: 
              schema:
                type: string
        '400':
          description: Ошибка в параметрах запроса.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/get_entities:
    get:
      summary: Получить список доменных сущностей
      description: Возвращает словарь всех доступных ключей (типов моделей) и их описаний.
      operationId: main.get_entities
      responses:
        '200':
          description: Словарь ключей сущностей в формате JSON.
          content:
            application/json: 
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/reports/formats:
    get:
      summary: Получить список форматов отчетов
      description: Возвращает список всех доступных форматов для построения отчетов.
      operationId: main.get_report_formats
      responses:
        '200':
          description: Список форматов отчетов в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: integer
              example:
                - name: "TXT"
                  value: 1
                - name: "CSV"
                  value: 2
                - name: "MARKDOWN"
                  value: 3
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/get_report_formats:
    get:
      summary: Получить список форматов отчетов (алиас)
      description: Возвращает список всех доступных форматов для построения отчетов.
      operationId: main.get_report_formats_alias
      responses:
        '200':
          description: Список форматов отчетов в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: integer
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/entity/{entity}:
    get:
      summary: Получить все сущности указанного типа
      description: Возвращает список всех объектов указанной доменной модели.
      operationId: main.get_all_entities
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
          description: Имя доменной модели (например, group_model, range_model, nomenclature_model, storage_model, receipt_model).
      responses:
        '200':
          description: Список объектов сущности в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '404':
          description: Тип сущности не найден.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

    post:
      summary: Создать новую доменную сущность
      description: Добавляет новую доменную сущность в хранилище с валидацией переданных данных.
      operationId: main.create_entity
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
          description: Имя доменной модели (например, group_model, range_model, nomenclature_model, storage_model).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Сущность успешно создана.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Ошибка валидации данных или некорректный запрос.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Тип сущности не найден.
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Сущность с таким уникальным кодом уже существует.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/entity/{entity}/{unique_code}:
    get:
      summary: Получить доменную сущность по идентификатору
      description: Возвращает данные конкретной сущности по ее уникальному коду.
      operationId: main.get_entity_by_id
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
          description: Имя доменной модели.
        - name: unique_code
          in: path
          required: true
          schema:
            type: string
          description: Уникальный код сущности.
      responses:
        '200':
          description: Объект сущности в формате JSON.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

    put:
      summary: Обновить доменную сущность
      description: Обновляет данные сущности. Запрещено менять код сущности, если она связана с другими сущностями.
      operationId: main.update_entity
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
          description: Имя доменной модели.
        - name: unique_code
          in: path
          required: true
          schema:
            type: string
          description: Уникальный код обновляемой сущности.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Сущность успешно обновлена.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Ошибка валидации данных.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Сущность не найдена.
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Запрещено изменять код используемой сущности или новый код уже занят.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

    delete:
      summary: Удалить доменную сущность
      description: Удаляет сущность из хранилища. Запрещено удалять сущность, если с ней связаны другие сущности.
      operationId: main.delete_entity
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
          description: Имя доменной модели.
        - name: unique_code
          in: path
          required: true
          schema:
            type: string
          description: Уникальный код удаляемой сущности.
      responses:
        '200':
          description: Сущность успешно удалена.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
        '404':
          description: Сущность не найдена.
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Запрещено удалять сущность, так как на нее ссылаются другие объекты.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/{entity}/filter:
    post:
      summary: Фильтровать доменные сущности через шаблон Прототип
      description: Фильтрует список объектов доменной модели указанного типа с помощью переданной DTO модели фильтрации.
      operationId: main.filter_entities
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
          description: Имя доменной модели (например, nomenclature_model, range_model, group_model, receipt_model).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Искомое наименование
                unique_code:
                  type: string
                  description: Искомый уникальный код
                filter_type:
                  type: string
                  enum: [EQUALS, LIKE, LESS, LESS_EQUAL, GREATER, GREATER_EQUAL]
                  description: Тип фильтрации
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      field_name:
                        type: string
                      filter_type:
                        type: string
                        enum: [EQUALS, LIKE, LESS, LESS_EQUAL, GREATER, GREATER_EQUAL]
                      value:
                        type: string
      responses:
        '200':
          description: Отфильтрованный список доменных сущностей.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Ошибка в теле запроса.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Тип сущности не найден.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/report/osv:
    post:
      summary: Сформировать оборотно-сальдовую ведомость (ОСВ)
      description: Формирует оборотно-сальдовую ведомость за период. Начальные остатки рассчитываются по транзакциям с датой не позже начала периода, обороты — по транзакциям внутри периода. Фильтрация транзакций выполняется через шаблон Прототип.
      operationId: main.get_osv_report
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date
                  description: Дата начала периода (включительно) в формате YYYY-MM-DD.
                end_date:
                  type: string
                  format: date
                  description: Дата окончания периода (включительно) в формате YYYY-MM-DD.
                name:
                  type: string
                unique_code:
                  type: string
                filter_type:
                  type: string
                  enum: [EQUALS, LIKE, LESS, LESS_EQUAL, GREATER, GREATER_EQUAL]
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      field_name:
                        type: string
                      filter_type:
                        type: string
                        enum: [EQUALS, LIKE, LESS, LESS_EQUAL, GREATER, GREATER_EQUAL]
                      value:
                        type: string
      responses:
        '200':
          description: Строки оборотно-сальдовой ведомости.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    storage_name:
                      type: string
                    storage_code:
                      type: string
                    nomenclature_name:
                      type: string
                    nomenclature_code:
                      type: string
                    range_name:
                      type: string
                    range_code:
                      type: string
                    initial_balance:
                      type: number
                    turnover_in:
                      type: number
                    turnover_out:
                      type: number
                    final_balance:
                      type: number
        '400':
          description: Ошибка в теле запроса.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/log:
    get:
      summary: Получить журнал логирования в формате JSON
      description: Возвращает список записей лога с возможностью фильтрации по полям и сортировки.
      operationId: main.get_logs
      parameters:
        - name: subsystem
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по названию подсистемы
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [INFO, ERROR, DEBUG]
          description: Фильтр по уровню сообщения
        - name: message
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по тексту сообщения (подстрока)
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [period, subsystem, level, message, unique_code]
          description: Поле для сортировки
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
          description: Порядок сортировки (по возрастанию или убыванию)
      responses:
        '200':
          description: Список записей лога в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    unique_code:
                      type: string
                    period:
                      type: string
                    subsystem:
                      type: string
                    level:
                      type: string
                    message:
                      type: string
        '400':
          description: Ошибка в параметрах запроса.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

    post:
      summary: Получить журнал логирования с расширенной фильтрацией через тело запроса
      description: Возвращает список записей лога с фильтрацией через структуру filter_dto и сортировкой.
      operationId: main.filter_logs
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [period, subsystem, level, message, unique_code]
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sort_by:
                  type: string
                sort_order:
                  type: string
                filters:
                  type: array
                  items:
                    type: object
                    properties:
                      field_name:
                        type: string
                      filter_type:
                        type: string
                        enum: [EQUALS, LIKE, LESS, LESS_EQUAL, GREATER, GREATER_EQUAL]
                      value:
                        type: string
      responses:
        '200':
          description: Список записей лога в формате JSON.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Некорректные параметры фильтрации или сортировки.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object

  /api/log/export:
    get:
      summary: Экспорт журнала логирования в TXT, CSV или MARKDOWN
      description: Выгружает журнал логов в виде файла (TXT, CSV) или документа для просмотра (MARKDOWN).
      operationId: main.export_logs
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [txt, csv, markdown]
            default: txt
          description: Формат выгрузки журнала логов
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [period, subsystem, level, message, unique_code]
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Экспортированные данные лога в выбранном формате.
          content:
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
        '400':
          description: Некорректный формат экспорта.
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Внутренняя ошибка сервера.
          content:
            application/json:
              schema:
                type: object
